# ---------------------------------------------------------------------------
# Live parameters (PARAM_GET / PARAM_SET). Ids are stable: append, never
# renumber. id < link.param_slots (each id has a persisted slot in the body's
# config block). value/min/max/default are i16 in `unit`. These are the
# params the P0 body implements; P1 adds FALL_DEG, BAL_KP_Q8, BAL_KD_MS,
# BAL_DB_A16, BAL_MAX_A16, HEAD_HOLD_MS (and P2 the geometry and bob/wag
# amplitudes) with the next free ids.

[[params]]
name = "WD_STOP_MS"
id = 0
default = 500
min = 100
max = 5000
unit = "ms"
doc = "Link watchdog stage 1: stop motion, epoch bump, EVENT WATCHDOG (20 ms resolution)."

[[params]]
name = "WD_REST_MS"
id = 1
default = 1500
min = 200
max = 10000
unit = "ms"
doc = "Link watchdog stage 2: REFLEX -> REST (never earlier than stage 1)."

[[params]]
name = "WD_LIMP_S"
